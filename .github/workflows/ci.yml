name: AI-native gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (controller + research-spec gate)
        run: python3 -m unittest discover -s tests -v
      - name: Research analysis tests (data integrity, models, holdout)
        run: |
          pip install -r research/requirements.txt
          python3 -m unittest discover -s research/tests -v
      - name: Research one-command rebuild from committed processed data (must be byte-identical)
        run: |
          python3 research/analysis/run_all.py --from-processed
          git diff --exit-code -- research/data/processed research/outputs ':!research/outputs/figures'
      - name: Research evidence QA (deliverables)
        run: |
          python3 research/analysis/fetch_sources.py
          python3 research/qa/qa_check.py
      - name: Validate Python source
        run: python3 -m compileall -q scripts tests .claude/hooks
      - name: Research spec structure gate
        run: python3 scripts/check_research_spec.py research/RESEARCH_SPEC.md
      - name: Research task frontier
        run: |
          python3 scripts/frontier.py check --registry research/work.json
          python3 scripts/frontier.py next --registry research/work.json
      - name: Validate contracts
        run: |
          python3 scripts/ai_native.py validate --contract contracts/research-spec.json
          python3 scripts/ai_native.py validate --contract examples/contract.json
      - name: Validate control-plane examples
        run: |
          python3 scripts/frontier.py check --registry examples/work.json
          python3 scripts/control_plane.py cycle --state examples/control-cycle-state.json --expect-action TASK_VERIFIED
